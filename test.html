<button class="btn-info" id="find-me">Mostrar mi ubicaci&oacute;n</button><br />
<p id="status"></p>
<a id="map-link" href="">Location unknown</a>
<script>
const options = {
    enableHighAccuracy: true,
    maximumAge: 30000,
    timeout: 27000,
  };  
function geoFindMe() {
  const status = document.querySelector("#status");
  const mapLink = document.querySelector("#map-link");
  
  mapLink.href = "";
  mapLink.textContent = "";

  function success(position) {
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;

    status.textContent = "";
    mapLink.href = `https://www.openstreetmap.org/#map=18/${latitude}/${longitude}`;
    //mapLink.href = `https://google.com/maps/place/@${latitude},${longitude}`;
    mapLink.textContent = `Latitud: ${latitude} , Longitud: ${longitude} `;
  }

  function error() {
    status.textContent = "Unable to retrieve your location";
  }

  if (!navigator.geolocation) {
    status.textContent = "Geolocation is not supported by your browser";
  } else {
    status.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(success, error,options);
  }
}

document.querySelector("#find-me").addEventListener("click", geoFindMe)
</script>
